name: Build and push Docker image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/neticeler-online' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.KAMATERA_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.KAMATERA_PORT || 22 }}" "${{ secrets.KAMATERA_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p ${{ secrets.KAMATERA_PORT || 22 }}"
          $SSH ${{ secrets.KAMATERA_USER }}@${{ secrets.KAMATERA_HOST }} "mkdir -p $DEPLOY_PATH"
          scp -i ~/.ssh/id_deploy -P ${{ secrets.KAMATERA_PORT || 22 }} docker-compose.yml \
            ${{ secrets.KAMATERA_USER }}@${{ secrets.KAMATERA_HOST }}:$DEPLOY_PATH/docker-compose.yml

      - name: Pull and restart
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/id_deploy -p ${{ secrets.KAMATERA_PORT || 22 }} \
            ${{ secrets.KAMATERA_USER }}@${{ secrets.KAMATERA_HOST }} \
            "set -e; cd $DEPLOY_PATH
             docker login ghcr.io -u ${{ github.actor }} --password-stdin
             export WEB_IMAGE=$IMAGE
             sed -i '/^WEB_IMAGE=/d' .env && echo \"WEB_IMAGE=\$WEB_IMAGE\" >> .env
             docker compose pull web
             docker compose up -d --remove-orphans
             docker image prune -f
             docker logout ghcr.io"
